# CodeRabbit configuration (gtmacdonald fork).
#
# Upstream (NousResearch) disables auto-review because CodeRabbit carries no
# merge weight there. This fork's workflow is one reviewed PR per change, so
# auto-review is ON here: every PR opened against the fork gets a review.
#
# On demand: comment `@coderabbitai review` (incremental) or
# `@coderabbitai full review` on any PR; `@coderabbitai ignore` mutes it.
reviews:
  auto_review:
    enabled: true
